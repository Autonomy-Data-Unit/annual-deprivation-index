# QOF (Quality and Outcomes Framework) column mappings per year.
#
# Each entry maps the raw column names to a standardised schema:
#   practice_code, list_pop, {disease_code_1}, {disease_code_2}, ...
#
# The parser reads the config for a given year, applies the column mapping,
# pivots from long to wide format, and outputs the standardised schema.
#
# file_pattern is relative to store/inputs/qof/raw/{year_key}/
#
# AGE-RESTRICTED DENOMINATORS
# ---------------------------
# QOF measures nine of its registers against an age-restricted list rather than the
# whole practice list, and publishes prevalence against that list. process_health
# emits a second rate, `{CODE}_qof_prevalence_rate`, computed against it. Which list
# applies to which register is read from the source's own PATIENT_LIST_TYPE column
# wherever the source has one, so most years need nothing here. Two do:
#
#   * `qof_age_denominators = false` marks a year whose source carries no
#     age-restricted denominator at all, so no second rate can be computed;
#   * a `[years.<year>.list_types]` table pins the mapping for a year that uses
#     age-restricted denominators but does not label them.
#
# The band labels are QOF's own PATIENT_LIST_TYPE values. Only bands present in
# `adi.utils.nomis.QOF_AGE_BANDS` are used, because a rate whose eligible population
# cannot be fetched could never be given the count and denominator that make it a
# publishable metric. That currently excludes CVDPP (30_74), which is withdrawn from
# QOF after 2019-20 and dropped before publication anyway.

# --- Era 1: 2013-14 ---
[years.2013_14]
format = "csv"
practice_code_col = "practicecode"
register_col = "disease_register_size"
list_pop_col = "practice_listsize"
disease_code_col = "indicator_group"
encoding = "utf-8"
file_pattern = "prevalencebyprac.csv"
# 2013-14 published ONE all-ages `practice_listsize` per practice and used it for every
# group, including the registers that are age-restricted in every later year: its own
# `prevalence` column is register/practice_listsize throughout. The age-restricted
# denominator is genuinely absent from the source, not merely unlabelled, so output
# year 2014 has no `{CODE}_qof_prevalence_rate` at all. Verified by the ratio of each
# group's summed list size to the largest, which is 1.0 for every group (HF reads 2.0
# only because of its duplicate rows).
qof_age_denominators = false
notes = "Duplicate HF rows per practice; extra groups SMOK, THY (24 total); no age-restricted denominators"

# --- Era 2: 2014-15 ---
[years.2014_15]
format = "csv"
practice_code_col = "PRACTICE_CODE"
register_col = "REGISTER_SIZE"
list_pop_col = "PRACTICE_LIST_SIZE"
disease_code_col = "INDICATOR_GROUP_CODE"
encoding = "cp1252"
file_pattern = "PREVALENCE_BY_PRAC_v2.csv"
notes = "Windows cp1252 encoding; has PRACTICE_NAME column; age-restricted denominators present but unlabelled"

# 2014-15 varies PRACTICE_LIST_SIZE per group -- correctly, and fractionally (61,477 of
# its rows carry a non-integer list size) -- but publishes no PATIENT_LIST_TYPE column to
# say which band each one is. These are QOF's 2014-15 business rules, pinned here rather
# than inferred at runtime so that a reissue in a different shape fails loudly instead of
# being silently re-derived. Verified against the file: each group's summed list size as a
# fraction of the all-ages total is CKD/DEP/EP 0.7935 (18+), DM 0.8050 (17+), OB/RA 0.8163
# (16+), OST 0.3529 (50+), CVDPP 0.5543 (30-74), everything else 1.0000.
#
# OB is 16+ in 2014-15 and 18+ from 2015-16. That is QOF's definition change, and it
# shows as a real one-year level step inside the new column; it is not smoothed over.
[years.2014_15.list_types]
CKD = "18OV"
DEP = "18OV"
EP = "18OV"
DM = "17OV"
OB = "16OV"
RA = "16OV"
OST = "50OV"
CVDPP = "30_74"

# --- Era 3: 2015-16 through 2019-20 ---
[years.2015_16]
format = "csv"
practice_code_col = "PRACTICE_CODE"
register_col = "REGISTER"
list_pop_col = "PATIENT_LIST_SIZE"
disease_code_col = "INDICATOR_GROUP_CODE"
encoding = "utf-8"
file_pattern = "PREVALENCE.csv"

